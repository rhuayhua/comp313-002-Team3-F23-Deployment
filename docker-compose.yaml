version: "3"
services:
  jpas-backend:
    image: rhuayhua/jpas-backend:latest
    container_name: jpas-backend
    ports:
      - "8910:8910" 
  jpas-frontend:
    image: rhuayhua/jpas-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=jpas-backend
    depends_on:
      - jpas-backend
